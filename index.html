<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathaly & Pedro | Invitación de Matrimonio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 font-sans antialiased">

<!-- Contenedor principal estilo móvil -->
<main class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col items-center pb-12">

    <!-- Portada con Imagen y Nombres -->
    <header class="w-full relative text-center bg-stone-200">
        <!-- Imagen principal (reemplazar la URL cuando tengan la foto definitiva) -->
        <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80"
             alt="Nathaly y Pedro"
             class="w-full h-80 object-cover">

        <div class="p-6 bg-white border-b shadow-sm">
            <p class="text-xs uppercase tracking-widest text-stone-500 mb-1">Nos Casamos</p>
            <h1 class="text-3xl font-serif font-bold text-stone-700">Nathaly & Pedro</h1>
        </div>
    </header>

    <!-- Cuenta Regresiva -->
    <section class="w-full p-6 text-center border-b border-stone-100">
        <h2 class="text-xs uppercase tracking-wider text-stone-400 mb-4 font-semibold">Faltan pocos días</h2>

        <div id="countdown" class="grid grid-cols-4 gap-2 text-center">
            <div class="bg-stone-50 p-3 rounded-lg border border-stone-200">
                <span id="days" class="block text-2xl font-bold text-stone-700">00</span>
                <span class="text-[10px] uppercase tracking-wider text-stone-400">Días</span>
            </div>
            <div class="bg-stone-50 p-3 rounded-lg border border-stone-200">
                <span id="hours" class="block text-2xl font-bold text-stone-700">00</span>
                <span class="text-[10px] uppercase tracking-wider text-stone-400">Horas</span>
            </div>
            <div class="bg-stone-50 p-3 rounded-lg border border-stone-200">
                <span id="minutes" class="block text-2xl font-bold text-stone-700">00</span>
                <span class="text-[10px] uppercase tracking-wider text-stone-400">Min</span>
            </div>
            <div class="bg-stone-50 p-3 rounded-lg border border-stone-200">
                <span id="seconds" class="block text-2xl font-bold text-stone-700">00</span>
                <span class="text-[10px] uppercase tracking-wider text-stone-400">Seg</span>
            </div>
        </div>
    </section>

    <!-- Mensaje de Bienvenida -->
    <section class="p-6 text-center">
        <p class="text-stone-600 text-sm leading-relaxed">
            Queremos invitarte a compartir con nosotros este momento tan especial. ¡Esperamos contar con tu presencia!
        </p>
    </section>

</main>

<!-- Script de Cuenta Regresiva -->
<script src="script.js"></script>
</body>
</html>
